# KVHomeLibrary за Apache 2.4 как reverse proxy.
#
# Файл: /etc/apache2/sites-available/kvhomelibrary.conf
# Включение:
#   sudo a2enmod proxy proxy_http headers ssl remoteip deflate http2
#   sudo a2ensite kvhomelibrary
#   sudo apache2ctl configtest
#   sudo systemctl reload apache2
#
# Перед использованием замените:
#   library.example.com  — ваше DNS-имя
#   admin@example.com    — e-mail администратора
#   пути к сертификатам Let's Encrypt
#
# ВАЖНО: приложение должно слушать только 127.0.0.1:8080.
# Если оно запущено с --host 0.0.0.0, переустановите сервис с KVL_HOST=127.0.0.1
# или поправьте ExecStart в /etc/systemd/system/kvhomelibrary.service.
#
# ВАЖНО: Apache проксирует запросы с адреса 127.0.0.1, поэтому приложение
# считает любой запрос локальным. Обязательно запускайте kvhomelibrary с
# --admin-password (KVL_ADMIN_PASSWORD) либо включите Basic Auth ниже.

<VirtualHost *:80>
    ServerName library.example.com
    ServerAdmin admin@example.com

    # Весь HTTP перенаправляем на HTTPS.
    Redirect permanent / https://library.example.com/

    ErrorLog  ${APACHE_LOG_DIR}/kvhomelibrary-error.log
    CustomLog ${APACHE_LOG_DIR}/kvhomelibrary-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName library.example.com
    ServerAdmin admin@example.com

    Protocols h2 http/1.1

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/library.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/library.example.com/privkey.pem
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder     on

    # Загрузка книг и ответы с большими ZIP/PDF могут быть небыстрыми.
    Timeout 600
    ProxyTimeout 600
    ProxyRequests Off
    ProxyPreserveHost On

    # Приложение слушает только loopback.
    ProxyPass        / http://127.0.0.1:8080/ connectiontimeout=10 timeout=600 retry=0
    ProxyPassReverse / http://127.0.0.1:8080/

    # Приложение формирует абсолютные ссылки в OPDS по Host.
    # ProxyPreserveHost сохраняет внешний Host, поэтому ссылки будут HTTPS.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
    ProxyAddHeaders On

    # Чтобы в логах Apache был реальный IP клиента, а не 127.0.0.1.
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 127.0.0.1

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # Сжатие текстовых ответов. EPUB/PDF/ZIP не сжимаем повторно.
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css
        AddOutputFilterByType DEFLATE text/xml application/xml application/atom+xml
        AddOutputFilterByType DEFLATE application/json application/javascript
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # ---- Вариант 1: защита админки средствами Apache ----
    # Если включаете этот блок, создайте файл паролей:
    #   sudo htpasswd -c /etc/apache2/kvhomelibrary.htpasswd admin
    #
    # <Location "/admin">
    #     AuthType Basic
    #     AuthName "KVHomeLibrary administration"
    #     AuthUserFile /etc/apache2/kvhomelibrary.htpasswd
    #     Require valid-user
    # </Location>
    #
    # ---- Вариант 2 (рекомендуется): пароль приложения ----
    # Запустите kvhomelibrary с --admin-password / KVL_ADMIN_PASSWORD.
    # Браузер запросит его при открытии /admin.
    # Если включён Basic Auth Apache, пароль приложения можно не задавать:
    # Apache уже не пропустит посторонних.

    <Location />
        Require all granted
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/kvhomelibrary-error.log
    CustomLog ${APACHE_LOG_DIR}/kvhomelibrary-access.log combined
</VirtualHost>
