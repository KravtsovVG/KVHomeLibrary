# KVHomeLibrary за Apache 2.4 на Windows (C:\Apache24).
#
# Куда положить:
#   C:\Apache24\conf\extra\kvhomelibrary.conf
#
# В C:\Apache24\conf\httpd.conf:
#   Listen 443
#   Include conf/extra/kvhomelibrary.conf
#
# Замените:
#   library.example.com — ваше DNS-имя или имя хоста
#   пути к сертификату и ключу
#
# Если в httpd.conf уже включён conf/extra/httpd-ssl.conf, отключите его
# (закомментируйте Include), чтобы не было второго Listen 443 и другого
# VirtualHost на тот же адрес.
# ВАЖНО:
#   приложение должно слушать 127.0.0.1:8080, а не 0.0.0.0;
#   Apache видит все запросы как локальные, поэтому обязательно задайте
#   пароль приложения (--admin-password / KVL_ADMIN_PASSWORD) либо
#   включите Basic Auth в блоке /admin ниже.

# --- Модули ---------------------------------------------------------------
# Если эти LoadModule уже раскомментированы в httpd.conf, блоки IfModule
# не загрузят их повторно.
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !authz_core_module>
    LoadModule authz_core_module modules/mod_authz_core.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>
<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>
<IfModule !alias_module>
    LoadModule alias_module modules/mod_alias.so
</IfModule>
<IfModule !socache_shmcb_module>
    LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
</IfModule>
<IfModule !ssl_module>
    LoadModule ssl_module modules/mod_ssl.so
</IfModule>
<IfModule !deflate_module>
    LoadModule deflate_module modules/mod_deflate.so
</IfModule>
<IfModule !filter_module>
    LoadModule filter_module modules/mod_filter.so
</IfModule>

# --- HTTP -> HTTPS --------------------------------------------------------
<VirtualHost *:80>
    ServerName library.example.com
    Redirect permanent / https://library.example.com/
</VirtualHost>

# --- HTTPS reverse proxy --------------------------------------------------
<VirtualHost *:443>
    ServerName library.example.com
    ServerAdmin admin@example.com

    SSLEngine on
    SSLCertificateFile    "C:/Apache24/conf/ssl/library-fullchain.crt"
    SSLCertificateKeyFile "C:/Apache24/conf/ssl/library.key"
    SSLProtocol           all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite        HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder   on

    # Большие PDF/EPUB/ZIP и ответы с файлами.
    Timeout 600
    ProxyTimeout 600
    ProxyRequests Off
    ProxyPreserveHost On

    ProxyPass        / http://127.0.0.1:8080/ connectiontimeout=10 timeout=600 retry=0
    ProxyPassReverse / http://127.0.0.1:8080/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"
    ProxyAddHeaders On

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/css
        AddOutputFilterByType DEFLATE text/xml application/xml application/atom+xml
        AddOutputFilterByType DEFLATE application/json application/javascript
        AddOutputFilterByType DEFLATE image/svg+xml
    </IfModule>

    # --- Вариант 1: Basic Auth Apache ------------------------------------
    # Создать файл:
    #   C:\Apache24\bin\htpasswd.exe -c C:\Apache24\conf\kvhomelibrary.htpasswd admin
    #
    # <Location "/admin">
    #     AuthType Basic
    #     AuthName "KVHomeLibrary administration"
    #     AuthUserFile "C:/Apache24/conf/kvhomelibrary.htpasswd"
    #     Require valid-user
    # </Location>

    # --- Вариант 2 (рекомендуется): пароль приложения --------------------
    # Запускайте kvhomelibrary с --admin-password, тогда /admin
    # защищён самим приложением.

    <Location />
        Require all granted
    </Location>

    ErrorLog  "C:/Apache24/logs/kvhomelibrary-error.log"
    CustomLog "C:/Apache24/logs/kvhomelibrary-access.log" combined
</VirtualHost>
