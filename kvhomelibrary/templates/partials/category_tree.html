<div class="panel category-tree">
  <div class="category-tree-head">
    <h2>Дерево жанров</h2>
    <a class="small" href="/ui/genres">все жанры</a>
  </div>
  {% if roots %}
  <div class="category-tree-body">
    {% for item in roots %}
    <a class="category-node{% if item.root %} category-root-link{% endif %}" href="{{ item.url }}" style="padding-left:{{ item.depth }}rem">
      <span>{{ item.label }}</span>
      <span class="count">{{ item.books }}</span>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <div class="empty">Жанры не найдены.</div>
  {% endif %}
</div>
